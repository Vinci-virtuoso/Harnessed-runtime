# The routing suite (FR-118, ticket 178), read by src/harnessed/router/suite.py and nothing else.
# Never a smoke or holdout case: it scores the router, and no score here ever reaches improve/.
#
# Transcribed from .spec/research.md, Appendix A, the exact inputs of the 2026-09-25 spike.
# Labels are the planner's, hand-reviewed; `accepted` lists every route counted as right.
# Tasks 1 to 20 are real operator prompts from the ledger (`source: operator`), 21 to 28 were
# written for routes with no history (`source: written`). No further per-route cases from recent
# sessions are added: every other ledger prompt would need a label nobody has reviewed (MUST 8).
#
# `routes` is the spike's draft registry: the route vocabulary the committed FakeDecider fixtures
# were recorded against. The live tier asks with the operator's own agents.toml instead.
suite: routing
routes:
  claude-code: "Research that needs live web search or reading documents and papers, and coding or running applications inside a repository."
  codex: "Changing code in a repository: implement, refactor, fix a bug, add or run tests."
  grok: "Current events and live facts: today's news, who holds an office now, prices, sports results."
  email_writer: "Drafting or replying to emails."
  wireframe_designer: "Designing wireframes, screen layouts or UI mockups."
  motion_designer: "Motion design: animations, animated logos, short video intros."
tasks:
  - id: routing-001-president-ages
    task: "Add the current age of the current president of the United States to the current age of the current president of Nigeria, then divide their sum by the number of times Liverpool has won the Champions League"
    accepted: [claude-code, grok]
    source: operator
  - id: routing-002-lithuania-president
    task: "as of today September 25, 2026 who is the current president of Lithuania?"
    accepted: [claude-code, grok]
    source: operator
  - id: routing-003-todays-date
    task: "what is today's date?"
    accepted: [grok, groq_chat]
    source: operator
  - id: routing-004-blackrock-paper
    task: "Find the research paper BlackRock published on AI and digital assets and summarise its main findings."
    accepted: [claude-code]
    source: operator
  - id: routing-005-spawn-claude-code
    task: "spawn claude code to search the web about Black rock research paper about the connection between AI and digital assets"
    accepted: [claude-code]
    source: operator
