# One workflow, three operating systems (decision 96, FR-181). The dashboard harness runs before the
# Python harness in the same job, never beside it. The wheel is built once in `build`; the clean
# install consumes those bytes. The first green hosted run is the operator's record (ticket 327).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"
  UV_VERSION: "0.8.17"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      # The notices the wheel carries, written from both lockfiles now that node_modules exists
      # (ticket 336, decision 108); the gateway extra is installed so its licences can be read.
      - run: uv run --extra gateway python scripts/notices.py
      - run: npm --prefix dashboard run build
      - run: npm --prefix dashboard run export
      - run: uv build
      - name: Write SHA256SUMS
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows, macos, linux]
    runs-on: ${{ fromJSON('{"windows":"windows-latest","macos":"macos-latest","linux":"ubuntu-latest"}')[matrix.os] }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.os }}-${{ hashFiles('dashboard/package-lock.json') }}
        if: matrix.os == 'linux'
      - name: Install the locked dashboard dependencies
        run: npm --prefix dashboard ci
      - name: Install Playwright Chromium
        working-directory: dashboard
        run: npx --no-install playwright install --with-deps chromium
        if: matrix.os == 'linux'
      - name: Install Playwright Chromium
        working-directory: dashboard
        run: npx --no-install playwright install chromium
        if: matrix.os != 'linux'
      - name: Install Python dependencies for the dashboard harness
        run: uv sync --locked --all-extras
      - name: Dashboard harness
        run: ./scripts/verify-dashboard.ps1
        shell: pwsh
        if: matrix.os == 'windows'
      - name: Dashboard harness
        run: ./scripts/verify-dashboard.sh
        if: matrix.os != 'windows'
      - name: Python harness
        run: ./scripts/verify.ps1
        shell: pwsh
        if: matrix.os == 'windows'
      - name: Python harness
        run: ./scripts/verify.sh
        if: matrix.os != 'windows'

  clean-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows, macos, linux]
    runs-on: ${{ fromJSON('{"windows":"windows-latest","macos":"macos-latest","linux":"ubuntu-latest"}')[matrix.os] }}
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Hide every node from PATH
        shell: python
        run: |
          import os, shutil
          keep = [d for d in os.environ["PATH"].split(os.pathsep) if d and not shutil.which("node", path=d)]
          path = os.pathsep.join(keep)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("PATH=" + path + "\n")
          assert shutil.which("node", path=path) is None, "node is still on PATH"
          print("node hidden:", len(os.environ["PATH"].split(os.pathsep)) - len(keep), "directories dropped")
      - name: Assert node is gone
        shell: bash
        run: |
          if command -v node >/dev/null 2>&1; then echo "node is still on PATH"; exit 1; fi
      - name: Block 1
        shell: pwsh
        if: matrix.os == 'windows'
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
      - name: Block 1
        shell: bash
        if: matrix.os != 'windows'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Open a new terminal (uv bin onto PATH)
        shell: bash
        run: |
          p="$HOME/.local/bin"
          if command -v cygpath >/dev/null 2>&1; then p=$(cygpath -w "$p"); fi
          echo "$p" >> "$GITHUB_PATH"
      - name: Watch for the dashboard
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/watch.py" <<'PY'
          import os, subprocess, sys, time, urllib.request

          TEMP = os.environ["RUNNER_TEMP"]
          WINDOWS = os.name == "nt"


          def running() -> bool:
              if WINDOWS:
                  out = subprocess.run(["tasklist", "/FI", "IMAGENAME eq harnessed.exe"], capture_output=True, text=True).stdout
                  return "harnessed.exe" in out
              return subprocess.run(["pgrep", "-f", "harnessed dashboard"], capture_output=True).returncode == 0


          def status(path: str) -> int:
              try:
                  return urllib.request.urlopen("http://127.0.0.1:8756" + path, timeout=5).status
              except Exception:
                  return 0


          deadline = time.time() + 900
          while not running():
              if time.time() > deadline:
                  sys.exit("watch: block 2 never reached the dashboard")
              time.sleep(1)
          for _ in range(60):
              if status("/") == 200 and status("/v1/health") == 200:
                  open(os.path.join(TEMP, "dashboard.ok"), "w").write("ok\n")
                  break
              time.sleep(1)
          if WINDOWS:
              subprocess.run(["taskkill", "/F", "/T", "/IM", "harnessed.exe"], capture_output=True)
          else:
              subprocess.run(["pkill", "-INT", "-f", "harnessed dashboard"], capture_output=True)
          PY
          PY=$(command -v python3 || command -v python)
          nohup "$PY" "$RUNNER_TEMP/watch.py" > "$RUNNER_TEMP/watch.log" 2>&1 &
      - name: Block 2
        id: block2
        shell: bash
        continue-on-error: true
        env:
          UV_FIND_LINKS: ${{ github.workspace }}/dist
        run: |
          uv tool install --python 3.12 "harnessed-runtime[gateway]"
          harnessed --version
          mkdir harnessed-demo
          cd harnessed-demo
          harnessed init --provider fake --no-validate
          harnessed doctor --offline
          harnessed eval run smoke --fresh --provider fake
          harnessed improve run --dry-run --provider fake
          harnessed improve promote cand_4820460a275e0bc8 --provider fake
          harnessed eval run smoke --fresh --provider fake
          harnessed dashboard
      - name: Dashboard answered / and /v1/health with 200 within 60 s
        shell: bash
        run: |
          sleep 3
          cat "$RUNNER_TEMP/watch.log" || true
          test -f "$RUNNER_TEMP/dashboard.ok" || { echo "the dashboard never answered 200 at / and /v1/health"; exit 1; }
      - name: Prove the installed wheel (harnessed --version and the .stamp)
        shell: python
        run: |
          import glob, os, re, subprocess, zipfile
          from pathlib import Path

          wheel = glob.glob("dist/harnessed_runtime-*.whl")
          assert len(wheel) == 1, wheel
          version = re.match(r"harnessed_runtime-([^-]+)-", os.path.basename(wheel[0])).group(1)
          shown = subprocess.run(["harnessed", "--version"], capture_output=True, text=True, check=True).stdout
          assert version in shown, (version, shown)
          with zipfile.ZipFile(wheel[0]) as z:
              built = z.read(next(n for n in z.namelist() if n.endswith("dashboard_static/.stamp")))
          tool = subprocess.run(["uv", "tool", "dir"], capture_output=True, text=True, check=True).stdout.strip()
          found = glob.glob(os.path.join(tool, "harnessed-runtime", "**", "dashboard_static", ".stamp"), recursive=True)
          resolved = {Path(path).resolve() for path in found}
          assert len(resolved) == 1, found
          assert resolved.pop().read_bytes() == built, "the installed stamp is not the built wheel's"
          print("installed wheel", version, "carries the built .stamp")
      - name: Enable linger for user systemd
        if: matrix.os == 'linux'
        run: sudo loginctl enable-linger "$USER"
      - name: Schedule install
        shell: bash
        run: |
          cd harnessed-demo
          harnessed schedule install
      - name: Doctor names the scheduler
        shell: bash
        run: |
          cd harnessed-demo
          harnessed doctor --offline | tee "$RUNNER_TEMP/doctor.txt"
          case "${{ matrix.os }}" in
            windows) want="TaskSchedulerBackend" ;;
            macos) want="LaunchdBackend" ;;
            linux)
              if systemctl --user show-environment >/dev/null 2>&1; then
                want="SystemdUserBackend"
              else
                want="CrontabBackend (no user systemd answered"
              fi ;;
          esac
          grep -F "scheduler: $want" "$RUNNER_TEMP/doctor.txt"
          # a CrontabBackend (no user systemd answered ...) line is the asserted crontab fallback
      - name: Schedule uninstall
        shell: bash
        run: |
          cd harnessed-demo
          harnessed schedule uninstall

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan every commit with gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --exit-code 1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Check the README's external links
        run: uv run --no-project python scripts/check_links.py
